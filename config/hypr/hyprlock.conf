# Minimal lock screen: blurred wallpaper, big clock, one input field

general {
    grace = 1
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(12,12,12)
    blur_size = 8
    blur_passes = 3
    noise = 0.0117
    brightness = 0.5
    contrast = 1.0
    vibrancy = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.92)
    font_size = 130
    font_family = JetBrainsMono Nerd Font Light
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] niri msg keyboard-layouts | grep -q '\*.*Russian' && echo "󰌌 ru" || echo "󰌌 en"
    color = rgba(255, 255, 255, 0.55)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    rounding = 22
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.35)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 0.9)
    check_color = rgba(255, 255, 255, 0.6)
    fail_color = rgba(243, 139, 168, 0.8)
    capslock_color = rgba(249, 226, 175, 0.8)
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff66">password</span>
    fail_text = <span foreground="##f38ba8">wrong</span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
